name: Docker image check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t moltnode-mcp .
      - name: MCP handshake over stdio (initialize + tools/list)
        run: |
          out=$(printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 docker run -i --rm moltnode-mcp | head -2)
          echo "$out"
          echo "$out" | grep -q '"chord_swap_quote"'
